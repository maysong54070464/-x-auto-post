name: Generate X Posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate post
        run: |
          python generate_posts.py > today_post.txt

      - name: Save post
        run: |
          echo "" >> posts.txt
          echo "===== $(date -u '+%Y-%m-%d') =====" >> posts.txt
          cat today_post.txt >> posts.txt

      - name: Commit generated post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.txt
          git diff --cached --quiet || git commit -m "Generate daily X post"
          git push
